<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="fundo-gradiente" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#0f231a"/>
    </linearGradient>
  </defs>
  <!-- Fundo com gradiente suave inspirado na identidade visual -->
  <rect width="600" height="400" fill="url(#fundo-gradiente)"/>
  
  <!-- Detalhe decorativo sutil de moldura -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="#2e5944" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Ícone de câmera e busca científica -->
  <g transform="translate(300, 160)" text-anchor="middle">
    <!-- Câmera estilizada -->
    <path d="M -40,-20 L -25,-20 L -18,-32 L 18,-32 L 25,-20 L 40,-20 C 48,-20 54,-14 54,-6 L 54,34 C 54,42 48,48 40,48 L -40,48 C -48,48 -54,42 -54,34 L -54,-6 C -54,-14 -48,-20 -40,-20 Z" fill="none" stroke="#8cb89f" stroke-width="4" stroke-linejoin="round"/>
    <!-- Lente / Registro -->
    <circle cx="0" cy="14" r="22" fill="none" stroke="#8cb89f" stroke-width="4"/>
    <circle cx="0" cy="14" r="10" fill="#2e5944"/>
  </g>

  <!-- Tipografia institucional -->
  <text x="300" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8f5e9" text-anchor="middle" letter-spacing="0.5">
    Fotografia em Catalogação
  </text>
  <text x="300" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#a5d6a7" text-anchor="middle">
    Espécie com ocorrência comprovada na Paraíba
  </text>
  <text x="300" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#81c784" text-anchor="middle" font-style="italic">
    Aguardando registro fotográfico validado cientificamente
  </text>
</svg>
